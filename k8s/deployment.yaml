apiVersion: apps/v1
kind: Deployment

metadata:
  name: aks-cicd-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: aks-cicd-demo

  template:
    metadata:
      labels:
        app: aks-cicd-demo

    spec:
      containers:
        - name: aks-cicd-demo
          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
